name: Publish Blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: leanprover verso-blueprint v4.32.0 project_template

jobs:
  build:
    runs-on: ubuntu-latest
    container: leanprover/lean4:v4.32.0
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the Blueprint website
        run: |
          lake update
          ./scripts/ci-pages.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: leanprover verso-blueprint v4.32.0 project_template/_out/site/html-multi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
